<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UNTCPP - Űrlap</title>

    <style>
        html, body{
            font-family: Arial, sans-serif;
            font-size: 16px;
        }
        *{
            box-sizing: border-box;
        }
        section{
            width: 50rem;
            background-color: aqua;
            padding: 1rem;
            text-align: center;
            border-radius: 0.5rem;
            box-shadow: inset 0 0 0.5rem 0 black,
                        0.25rem 0.25rem 0.5rem 0.25rem black;
        }
        header{
            width: 50rem;
            padding: 1rem;
            text-align: center;
            font-size: 2rem;
            font-weight: bold;
        }
        footer{
            width: 50rem;
            margin-top: 2rem;
            border-top: 0.1rem sold black;
            padding: 1rem;
            text-align: right;
            font-size: 0.8rem;
        }
        label{
            display: block;
            width: 100%;
            text-align: left;
            gap: 1rem;
            margin: 1rem;
        }
        .sidebyside{
            display: flex;
            flex-direction: row;
            gap: 1rem;
            justify-content: left;
        }
    </style>
</head>
<body>

    <header>HTML 5 Űrlap - UNTCPP</header>

    <section>
        <form action="feldolgozo.php" target="_self" method="post" id="urlap">
            <label for="nev">Név:<input type="text" id="nev" name="nev" required pattern="" title="Ird be a neved" placeholder="Írd be a neved" autofocus autocomplete="off"></label>

            <label for="pin">PIN kód:<input type="password"     id="pin" name="pin" required pattern="" title="4 számjegyű PIN kód" placeholder="PIN kód"></label>

            <label for="fav_fruit">Kedvenc gyümölcs:<input list="gyumolcsok"    id="fav_fruit" name="fav_fruit" placeholder="Alma,...." title="Alma, Körte, Szőlő, Banán, Narancs">
            <datalist id="gyumolcsok">
                <option value="alma">Alma</option>
                <option value="körte">Körte</option>
                <option value="szőlő">Szőlő</option>
                <option value="banán">Banán</option>                
                <option value="narancs">Narancs</option>
            </datalist></label>

            <label for="age">Életkor:<input type="number" id="age" name="age" min="1" max="100" step="1" title="1 és 100 közötti érték" placeholder=""></label>

            <label for="feet_size">Lábméret<input type="number" id="feet_size" max="50" step="0.5"></label>

            <label for="confidence">Önbizalom:<input type="range" min="0" max="100" step="0.1" id="confidence"></label>
        </form>
        <br>
        <div class="sidebyside">
            <input type="submit" value="Elküld" form="urlap">
            <input type="submit" value="Elküld ellenőrzés nélkül" formnovalidate form="urlap">
        </div>
    </section>

</body>
</html>
